# httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-countries-httproute
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
  hostnames:
    - go-api.cloudninja.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: go-countries-service
          port: 7070
