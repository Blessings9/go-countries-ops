apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: go-countries
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # imagePullSecrets:
      #   - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/blessings9/go-countries-gateway:latest   # <-- replace OWNER (lowercase); prefer a sha-xxxxxxx tag
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Base URL only; the gateway adds /countries/<name> itself.
            # Resolves through the country-service Service in the same namespace.
            - name: COUNTRY_SERVICE_URL
              value: "http://country-service:8081"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: go-countries
  labels:
    app: gateway
spec:
  # ClusterIP = reachable inside the cluster only.
  # Test with: kubectl -n go-countries port-forward svc/gateway 8080:80
  # To expose it: change to LoadBalancer / NodePort, or put an Ingress in front.
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http